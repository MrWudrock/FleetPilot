# Maintenance Agent — Конфигурация

agent:
  name: maintenance-agent
  version: "1.0"
  description: "Предиктивное ТО по телематике, пробегу, CAN-кодам"

# Интеграции
integrations:
  telematics:
    providers: [omnicomm, stavtrack]
    sync_interval_min: 15
    data_types:
      - odometer
      - engine_hours
      - can_dtc
      - temperature
      - vibration
  1c:
    enabled: false
    api_url: "${1C_API_URL}"
    api_key: "${1C_API_KEY}"
    sync_interval_hours: 6
  parts_suppliers:
    enabled: false
    providers: []

# Интервалы ТО
maintenance_intervals:
  oil_change:
    interval_km: 15000
    interval_months: 6
    priority: high
  oil_filter:
    interval_km: 15000
    interval_months: 6
    priority: high
  air_filter:
    interval_km: 30000
    interval_months: 12
    priority: medium
  fuel_filter:
    interval_km: 30000
    interval_months: 12
    priority: medium
  brake_pads:
    interval_km: 50000
    interval_months: 24
    priority: high
  tires:
    interval_km: 80000
    interval_months: 36
    priority: medium
  timing_belt:
    interval_km: 100000
    interval_months: 48
    priority: critical
  inspection:
    interval_km: 10000
    interval_months: 12
    priority: medium
  transmission_oil:
    interval_km: 60000
    interval_months: 24
    priority: high
  coolant:
    interval_km: 60000
    interval_months: 24
    priority: medium

# DTC-коды (ключевые)
dtc_critical:
  - code: "P0300"
    description: "Пропуски зажигания"
    action: "Немедленный осмотр"
  - code: "P0101"
    description: "Датчик расхода воздуха"
    action: "Проверить в течение 3 дней"
  - code: "P0401"
    description: "EGR nied przepływ"
    action: "Плановый ремонт"
  - code: "U0100"
    description: "Потеря связи с ECU"
    action: "Немедленный осмотр"
  - code: "P0562"
    description: "Низкое напряжение"
    action: "Проверить генератор"

# Прогнозирование
forecasting:
  method: hybrid
  components:
    - type: rule_based
      weight: 0.6
      description: "Интервалы ТО по пробегу/времени"
    - type: ml_regression
      weight: 0.3
      description: "Тренд по телематике"
    - type: dtc_trigger
      weight: 0.1
      description: "DTC-коды как триггеры"
  prediction_horizon_days: 30
  confidence_threshold: 0.75
  min_data_points: 10

# Пороги приоритетов
priority_thresholds:
  critical:
    days_before: 7
    mileage_percent: 95
    dtc_codes: [P0300, U0100]
  high:
    days_before: 14
    mileage_percent: 90
  medium:
    days_before: 30
    mileage_percent: 80
  low:
    days_before: 60
    mileage_percent: 70

# LLM для отчётов
llm:
  model: claude-sonnet
  temperature: 0.2
  max_tokens: 2000
  system_prompt_file: prompts/system.md

# Уведомления
notifications:
  channels:
    - type: email
      enabled: true
    - type: push
      enabled: true
  escalation:
    - priority: critical
      notify: [fleet_manager, mechanic]
      advance_notice_days: 7
    - priority: high
      notify: [fleet_manager]
      advance_notice_days: 14
    - priority: medium
      notify: [dispatcher]
      advance_notice_days: 30

# График ТО
scheduling:
  auto_schedule: false
  require_approval: true
  working_hours:
    start: "08:00"
    end: "18:00"
  working_days: [1, 2, 3, 4, 5]
  max_concurrent_repairs: 3

# Хранение данных
storage:
  telemetry_retention_days: 730
  maintenance_history_retention_days: 1825
  forecast_retention_days: 365

# Логирование
logging:
  level: INFO
  log_forecasts: true
  log_maintenance_events: true
  log_dtc_events: true
