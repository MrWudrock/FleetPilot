# Route Agent — Конфигурация

agent:
  name: route-agent
  version: "1.0"
  description: "Оптимизация маршрутов с учётом трафика и ограничений ТС"

# Интеграции
integrations:
  yandex_maps:
    enabled: true
    api_key: "${YANDEX_MAPS_API_KEY}"
    timeout_ms: 5000
    retry_count: 3
  gis_2:
    enabled: false
    api_key: "${GIS2_API_KEY}"
    fallback: true
  gps_providers:
    - omnicomm
    - stavtrack

# VRP Solver
solver:
  engine: ortools
  max_vehicles: 50
  max_time_per_route_sec: 30
  objectives:
    - type: distance
      weight: 0.4
    - type: time
      weight: 0.3
    - type: cost
      weight: 0.3

# Ограничения по умолчанию
constraints:
  max_driving_hours: 9
  max_break_after_hours: 4
  break_duration_min: 30
  max_daily_mileage_km: 600
  speed_factor:
    city: 0.7
    highway: 1.0
    rural: 0.85

# LLM
llm:
  model: claude-sonnet
  temperature: 0.3
  max_tokens: 2000
  fallback_rule_based: true

# Алерты
alerts:
  deviation_threshold_km: 5
  deviation_threshold_percent: 10
  late_arrival_threshold_min: 30
  notify:
    - dispatcher
    - fleet_manager

# Оптимизация
optimization:
  min_improvement_percent: 5
  require_approval: true
  approval_timeout_hours: 2
  auto_approve_if_no_response: false

# Кэширование
cache:
  distance_matrix_ttl_min: 15
  traffic_ttl_min: 5
  vehicle_positions_ttl_sec: 30

# Логирование
logging:
  level: INFO
  log_routes: true
  log_approvals: true
  retention_days: 90
