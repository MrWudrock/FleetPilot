<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FleetPilot Scan — интерактивная карта кодовой базы</title>
  <meta name="description" content="Интерактивный граф архитектуры FleetPilot: клиенты, API, агенты, хранилища." />
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #141416;
      --stroke: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #10b981;
      --client: #3b82f6;
      --api: #10b981;
      --store: #f59e0b;
      --agent: #a855f7;
      --external: #ef4444;
      --infra: #71717a;
      --other: #52525b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; overflow: hidden; }
    .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; align-items: center; gap: 16px; padding: 12px 20px;
      border-bottom: 1px solid var(--stroke); background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    header .sub { font-size: 12px; color: var(--muted); }
    header .spacer { flex: 1; }
    .search {
      width: 220px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--stroke);
      background: var(--bg); color: var(--text); font-size: 13px;
    }
    .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .btn {
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--stroke);
      background: var(--bg); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    #viewport {
      position: relative; overflow: hidden; cursor: grab; background:
        radial-gradient(circle at 1px 1px, #1f1f22 1px, transparent 0) 0 0 / 24px 24px;
    }
    #viewport.dragging { cursor: grabbing; }
    #canvas { width: 100%; height: 100%; display: block; }
    aside {
      border-left: 1px solid var(--stroke); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .card { padding: 16px; border-bottom: 1px solid var(--stroke); }
    .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .personality-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .personality-tag { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat { background: var(--bg); border: 1px solid var(--stroke); border-radius: 8px; padding: 8px 10px; }
    .stat b { display: block; font-size: 16px; font-weight: 600; }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .legend { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
    .legend-group { margin-bottom: 14px; }
    .legend-group h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .legend-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px;
      font-size: 12px; cursor: pointer; user-select: none;
    }
    .legend-item:hover, .legend-item.active { background: #1f1f22; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .detail { padding: 16px; border-top: 1px solid var(--stroke); min-height: 140px; }
    .detail h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .detail .kind-badge {
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--stroke); color: var(--muted); margin-bottom: 8px;
    }
    .detail p { font-size: 12px; color: var(--muted); line-height: 1.5; word-break: break-word; }
    .detail .path { font-family: ui-monospace, monospace; font-size: 11px; margin-top: 8px; color: #71717a; }
    .hint { position: absolute; left: 16px; bottom: 16px; font-size: 11px; color: var(--muted); pointer-events: none; }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,11,0.85); font-size: 14px; color: var(--muted);
    }
    .error { color: #f87171; padding: 24px; text-align: center; }
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { max-height: 40vh; border-left: none; border-top: 1px solid var(--stroke); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>FleetPilot Scan</h1>
        <div class="sub">Интерактивная карта кодовой базы</div>
      </div>
      <div class="spacer"></div>
      <input type="search" class="search" id="search" placeholder="Поиск узла…" />
      <button class="btn" id="fit">Fit</button>
      <button class="btn" id="reload">Обновить</button>
    </header>
    <div class="main">
      <div id="viewport">
        <svg id="canvas"></svg>
        <div class="hint">Колёсико — zoom · перетаскивание — pan · клик — детали</div>
        <div class="loading" id="loading">Загрузка графа…</div>
      </div>
      <aside>
        <div class="card" id="personality-card">
          <h2>Профиль проекта</h2>
          <div class="personality-title" id="p-title">—</div>
          <div class="personality-tag" id="p-tag">—</div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="detail" id="detail">
          <h3>Выберите узел</h3>
          <p>Кликните на узел на карте или в легенде, чтобы увидеть связи и путь в репозитории.</p>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/elkjs@0.9.3/lib/elk.bundled.js"></script>
  <script>
    const KIND_COLOR = {
      client: "#3b82f6", page: "#60a5fa", component: "#93c5fd", lib: "#2563eb", desktop: "#1d4ed8", landing: "#1e40af",
      api: "#10b981", route: "#34d399", service: "#059669", schema: "#047857", core: "#065f46",
      store: "#f59e0b", model: "#fbbf24", migration: "#d97706",
      agent: "#a855f7",
      external: "#ef4444", integration: "#f87171",
      infra: "#71717a", ci: "#52525b", script: "#3f3f46", doc: "#27272a", file: "#3f3f46", other: "#52525b",
    };

    const state = {
      graph: null,
      positions: new Map(),
      transform: { x: 80, y: 40, k: 1 },
      selected: null,
      highlightedKind: null,
      dragging: false,
      dragStart: null,
    };

    const svg = document.getElementById("canvas");
    const viewport = document.getElementById("viewport");
    const loading = document.getElementById("loading");

    function colorForKind(kind) {
      return KIND_COLOR[kind] || KIND_COLOR.other;
    }

    async function loadGraph() {
      loading.style.display = "flex";
      const res = await fetch("./data/graph.json?_=" + Date.now());
      if (!res.ok) throw new Error("graph.json not found — run: python scan/build_graph.py");
      state.graph = await res.json();
      loading.textContent = "Раскладка ELK…";
      await layoutGraph();
      render();
      fillMeta();
      buildLegend();
      loading.style.display = "none";
    }

    async function layoutGraph() {
      const g = state.graph;
      const elk = new ELK();
      const children = g.nodes.map((n) => ({
        id: n.id,
        width: Math.max(120, n.label.length * 7 + 32),
        height: 44,
      }));
      const elkGraph = {
        id: "root",
        layoutOptions: {
          "elk.algorithm": "layered",
          "elk.direction": "RIGHT",
          "elk.spacing.nodeNode": "36",
          "elk.layered.spacing.nodeNodeBetweenLayers": "80",
          "elk.edgeRouting": "ORTHOGONAL",
        },
        children,
        edges: g.edges.map((e, i) => ({ id: "e" + i, sources: [e.source], targets: [e.target] })),
      };
      try {
        const laid = await elk.layout(elkGraph);
        state.positions.clear();
        for (const c of laid.children || []) {
          state.positions.set(c.id, { x: c.x || 0, y: c.y || 0, w: c.width || 120, h: c.height || 44 });
        }
      } catch (err) {
        console.warn("ELK failed, using grid fallback", err);
        let x = 0, y = 0;
        for (const n of g.nodes) {
          state.positions.set(n.id, { x, y, w: 140, h: 44 });
          y += 56;
          if (y > 800) { y = 0; x += 180; }
        }
      }
    }

    function nodeById(id) {
      return state.graph.nodes.find((n) => n.id === id);
    }

    function isDimmed(node) {
      if (state.highlightedKind && node.kind !== state.highlightedKind) return true;
      if (!state.selected) return false;
      const sel = state.selected;
      const connected = new Set([sel]);
      for (const e of state.graph.edges) {
        if (e.source === sel) connected.add(e.target);
        if (e.target === sel) connected.add(e.source);
      }
      return !connected.has(node.id);
    }

    function render() {
      const g = state.graph;
      const ns = "http://www.w3.org/2000/svg";
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const pos of state.positions.values()) {
        minX = Math.min(minX, pos.x);
        minY = Math.min(minY, pos.y);
        maxX = Math.max(maxX, pos.x + pos.w);
        maxY = Math.max(maxY, pos.y + pos.h);
      }
      const pad = 60;
      const width = maxX - minX + pad * 2;
      const height = maxY - minY + pad * 2;
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const root = document.createElementNS(ns, "g");
      root.setAttribute("transform", `translate(${state.transform.x - minX + pad}, ${state.transform.y - minY + pad}) scale(${state.transform.k})`);
      root.id = "root-g";
      svg.appendChild(root);

      const defs = document.createElementNS(ns, "defs");
      const marker = document.createElementNS(ns, "marker");
      marker.setAttribute("id", "arrow");
      marker.setAttribute("markerWidth", "8");
      marker.setAttribute("markerHeight", "8");
      marker.setAttribute("refX", "7");
      marker.setAttribute("refY", "3");
      marker.setAttribute("orient", "auto");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M0,0 L8,3 L0,6 Z");
      path.setAttribute("fill", "#52525b");
      marker.appendChild(path);
      defs.appendChild(marker);
      root.appendChild(defs);

      for (const e of g.edges) {
        const s = state.positions.get(e.source);
        const t = state.positions.get(e.target);
        if (!s || !t) continue;
        const dim = state.selected && e.source !== state.selected && e.target !== state.selected
          && !(g.edges.some(x => x.source === state.selected && x.target === e.target));
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", s.x + s.w);
        line.setAttribute("y1", s.y + s.h / 2);
        line.setAttribute("x2", t.x);
        line.setAttribute("y2", t.y + t.h / 2);
        line.setAttribute("stroke", dim ? "#27272a" : "#3f3f46");
        line.setAttribute("stroke-width", state.selected && (e.source === state.selected || e.target === state.selected) ? "2" : "1");
        line.setAttribute("marker-end", "url(#arrow)");
        line.setAttribute("opacity", dim ? "0.25" : "0.7");
        root.appendChild(line);
      }

      for (const n of g.nodes) {
        const pos = state.positions.get(n.id);
        if (!pos) continue;
        const dim = isDimmed(n);
        const gNode = document.createElementNS(ns, "g");
        gNode.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);
        gNode.style.cursor = "pointer";
        gNode.addEventListener("click", (ev) => { ev.stopPropagation(); selectNode(n.id); });

        const rect = document.createElementNS(ns, "rect");
        rect.setAttribute("width", pos.w);
        rect.setAttribute("height", pos.h);
        rect.setAttribute("rx", "8");
        rect.setAttribute("fill", dim ? "#18181b" : "#141416");
        rect.setAttribute("stroke", state.selected === n.id ? colorForKind(n.kind) : (dim ? "#27272a" : colorForKind(n.kind)));
        rect.setAttribute("stroke-width", state.selected === n.id ? "2.5" : "1.5");
        gNode.appendChild(rect);

        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", "12");
        dot.setAttribute("cy", pos.h / 2);
        dot.setAttribute("r", "4");
        dot.setAttribute("fill", colorForKind(n.kind));
        gNode.appendChild(dot);

        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", "22");
        text.setAttribute("y", pos.h / 2 + 4);
        text.setAttribute("fill", dim ? "#71717a" : "#fafafa");
        text.setAttribute("font-size", "11");
        text.setAttribute("font-family", "Inter, system-ui, sans-serif");
        text.textContent = n.label.length > 22 ? n.label.slice(0, 20) + "…" : n.label;
        gNode.appendChild(text);

        root.appendChild(gNode);
      }
    }

    function selectNode(id) {
      state.selected = id;
      const n = nodeById(id);
      const el = document.getElementById("detail");
      if (!n) return;
      el.innerHTML = `
        <span class="kind-badge">${n.kind} · ${n.layer}</span>
        <h3>${n.label}</h3>
        <p>${n.summary || "—"}</p>
        ${n.path ? `<div class="path">${n.path}</div>` : ""}
      `;
      document.querySelectorAll(".legend-item").forEach((li) => {
        li.classList.toggle("active", li.dataset.id === id);
      });
      render();
    }

    function fillMeta() {
      const p = state.graph.personality;
      document.getElementById("p-title").textContent = p.title;
      document.getElementById("p-tag").textContent = p.tagline;
      const stats = state.graph.stats;
      document.getElementById("stats").innerHTML = `
        <div class="stat"><b>${stats.nodes}</b><span>узлов</span></div>
        <div class="stat"><b>${stats.edges}</b><span>связей</span></div>
        <div class="stat"><b>${stats.files_python}</b><span>Python</span></div>
        <div class="stat"><b>${stats.files_typescript}</b><span>TypeScript</span></div>
      `;
    }

    function buildLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      const kinds = {};
      for (const n of state.graph.nodes) {
        kinds[n.kind] = (kinds[n.kind] || 0) + 1;
      }
      const groups = state.graph.kind_groups;
      for (const [group, kindsInGroup] of Object.entries(groups)) {
        const block = document.createElement("div");
        block.className = "legend-group";
        block.innerHTML = `<h3>${group}</h3>`;
        for (const kind of kindsInGroup) {
          if (!kinds[kind]) continue;
          const item = document.createElement("div");
          item.className = "legend-item";
          item.dataset.kind = kind;
          item.innerHTML = `<span class="dot" style="background:${colorForKind(kind)}"></span>${kind} (${kinds[kind]})`;
          item.addEventListener("mouseenter", () => { state.highlightedKind = kind; render(); });
          item.addEventListener("mouseleave", () => { state.highlightedKind = null; render(); });
          item.addEventListener("click", () => {
            const first = state.graph.nodes.find((n) => n.kind === kind);
            if (first) selectNode(first.id);
          });
          block.appendChild(item);
        }
        legend.appendChild(block);
      }
    }

    function fitView() {
      const rect = viewport.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      if (!vb.width) return;
      const k = Math.min(rect.width / vb.width, rect.height / vb.height, 1.2) * 0.9;
      state.transform = { x: 20, y: 20, k: Math.max(0.15, k) };
      render();
    }

    viewport.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const delta = ev.deltaY > 0 ? 0.92 : 1.08;
      state.transform.k = Math.min(3, Math.max(0.1, state.transform.k * delta));
      render();
    }, { passive: false });

    viewport.addEventListener("mousedown", (ev) => {
      if (ev.target.closest("g[style]")) return;
      state.dragging = true;
      state.dragStart = { x: ev.clientX - state.transform.x, y: ev.clientY - state.transform.y };
      viewport.classList.add("dragging");
    });
    window.addEventListener("mousemove", (ev) => {
      if (!state.dragging) return;
      state.transform.x = ev.clientX - state.dragStart.x;
      state.transform.y = ev.clientY - state.dragStart.y;
      render();
    });
    window.addEventListener("mouseup", () => {
      state.dragging = false;
      viewport.classList.remove("dragging");
    });

    document.getElementById("fit").addEventListener("click", fitView);
    document.getElementById("reload").addEventListener("click", () => loadGraph().catch(showError));
    document.getElementById("search").addEventListener("input", (ev) => {
      const q = ev.target.value.trim().toLowerCase();
      if (!q) return;
      const hit = state.graph?.nodes.find((n) =>
        n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || (n.path && n.path.toLowerCase().includes(q))
      );
      if (hit) selectNode(hit.id);
    });

    function showError(err) {
      loading.innerHTML = `<div class="error">${err.message}<br><br>python scan/build_graph.py</div>`;
    }

    loadGraph().then(fitView).catch(showError);
  </script>
</body>
</html>
